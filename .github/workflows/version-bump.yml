name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate version format
        run: bash scripts/ci/validate-version.sh "${{ inputs.version }}"

      - name: Bump version
        run: node scripts/ci/bump-version.js "${{ inputs.version }}"

      - name: Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json .claude-plugin/plugin.json
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: bump version to ${{ inputs.version }}" \
            --body "Bumps version to \`${{ inputs.version }}\` in \`package.json\` and \`plugin.json\`.\n\nAfter merging, run the **Release** workflow with version \`${{ inputs.version }}\`."
