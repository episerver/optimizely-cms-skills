name: Skill Compatibility Check

on:
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'skill-deps.json'
      - '.claude-plugin/plugin.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run against'
        required: true
      post_comment:
        description: 'Post results as a PR comment'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  check-skill-hashes:
    runs-on: ubuntu-latest
    outputs:
      affected_skills: ${{ steps.affected.outputs.skills }}
      has_affected: ${{ steps.affected.outputs.has_affected }}
      report: ${{ steps.check.outputs.report }}
      has_changes: ${{ steps.check.outputs.exit_code != '0' }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve PR ref
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} --jq '{head_ref: .head.ref, number: .number}')
          echo "head_ref=$(echo "$PR_DATA" | jq -r '.head_ref')" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$PR_DATA" | jq -r '.number')" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref || github.head_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate skill structure
        run: node scripts/validate-skills.js --ci --skip-hash-freshness

      - name: Check skill hashes
        id: check
        run: |
          set +e
          REPORT=$(node scripts/check-skill-hashes.js --json)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Update hashes if mismatched
        if: steps.check.outputs.exit_code != '0'
        run: node scripts/update-skill-hashes.js

      - name: Build affected skills list
        id: affected
        if: steps.check.outputs.exit_code != '0'
        run: |
          node -e "
            const report = JSON.parse(process.env.REPORT);
            const manifest = JSON.parse(require('fs').readFileSync('skill-deps.json', 'utf-8'));
            const skills = [];
            const seen = new Set();
            for (const s of [...(report.changed || []), ...(report.added || [])]) {
              if (!seen.has(s.name)) {
                seen.add(s.name);
                skills.push({ name: s.name, path: s.path });
              }
            }
            for (const name of (report.transitivelyAffected || [])) {
              if (!seen.has(name) && manifest.skills[name]) {
                seen.add(name);
                skills.push({ name, path: manifest.skills[name].path });
              }
            }
            console.log(JSON.stringify(skills));
          " > affected.json
          SKILLS=$(cat affected.json)
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$SKILLS" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "has_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_affected=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPORT: ${{ steps.check.outputs.report }}

      - name: Commit updated hashes
        if: steps.check.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-deps.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update skill-deps.json hashes [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push

  run-evals:
    needs: check-skill-hashes
    if: needs.check-skill-hashes.outputs.has_affected == 'true'
    uses: ./.github/workflows/skill-evals.yml
    with:
      skills: ${{ needs.check-skill-hashes.outputs.affected_skills }}
    secrets: inherit

  post-comment:
    needs: [check-skill-hashes, run-evals]
    if: always() && needs.check-skill-hashes.outputs.has_changes == 'true' && (github.event_name == 'pull_request' || inputs.post_comment)
    runs-on: ubuntu-latest
    steps:
      - name: Download eval results
        if: needs.run-evals.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: eval-results
          path: eval-results/
        continue-on-error: true

      - name: Post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(process.env.REPORT);

            let body = '## Skill Compatibility Report\n\n';

            if (report.changed.length > 0) {
              body += '### Changed Skills\n';
              for (const s of report.changed) {
                body += `- \`${s.name}\` (${s.path})\n`;
              }
              body += '\n';
            }

            if (report.added.length > 0) {
              body += '### New Skills\n';
              for (const s of report.added) {
                body += `- \`${s.name}\` (${s.path})\n`;
              }
              body += '\n';
            }

            if (report.removed.length > 0) {
              body += '### Removed Skills\n';
              for (const s of report.removed) {
                body += `- \`${s.name}\` (${s.path})\n`;
              }
              body += '\n';
            }

            if (report.transitivelyAffected.length > 0) {
              body += '### Transitively Affected\n';
              body += 'These skills depend on changed skills and may need re-evaluation:\n';
              for (const name of report.transitivelyAffected.sort()) {
                body += `- \`${name}\`\n`;
              }
              body += '\n';
            }

            // Include eval results if available
            const evalPath = 'eval-results/eval-results.json';
            if (fs.existsSync(evalPath)) {
              try {
                const evalResults = JSON.parse(fs.readFileSync(evalPath, 'utf-8'));
                body += '### Evaluation Results\n\n';
                body += '| Skill | Score | Status |\n';
                body += '|-------|-------|--------|\n';
                for (const skill of evalResults.skills || []) {
                  const icon = skill.passed ? '✅' : '❌';
                  body += `| \`${skill.skill}\` | ${skill.score}% | ${icon} |\n`;
                }
                body += `\n**Overall: ${evalResults.summary.passed}/${evalResults.summary.total} passed** `;
                body += `(${evalResults.summary.passedAssertions}/${evalResults.summary.totalAssertions} assertions)\n\n`;
              } catch (e) {
                body += '### Evaluation Results\n\n';
                body += '⚠️ Could not parse eval results.\n\n';
              }
            } else if (process.env.EVALS_RESULT === 'failure') {
              body += '### Evaluation Results\n\n';
              body += '❌ Evaluation workflow failed. Check the [workflow run](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions) for details.\n\n';
            } else if (process.env.EVALS_RESULT === 'skipped') {
              body += '### Evaluation Results\n\n';
              body += '⏭️ No evaluations were needed.\n\n';
            }

            body += '`skill-deps.json` has been auto-updated in this PR.';

            const prNumber = process.env.PR_NUMBER || context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
        env:
          REPORT: ${{ needs.check-skill-hashes.outputs.report }}
          PR_NUMBER: ${{ needs.check-skill-hashes.outputs.pr_number }}
          EVALS_RESULT: ${{ needs.run-evals.result }}
